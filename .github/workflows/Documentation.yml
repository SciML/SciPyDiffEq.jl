name: Documentation

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:

# The documentation build needs these permissions to cache aggressively
# and to deploy the built site.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    name: "Documentation"
    runs-on: ubuntu-latest
    env:
      # Whether this run has credentials that can actually push to gh-pages.
      # Same guard as the reusable workflow: pull requests from forks and
      # Dependabot runs get empty tokens so Documenter verifies the build
      # without attempting a doomed deploy.
      CAN_DEPLOY_DOCS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PyCall builds against the runner's system python3; `using SciPyDiffEq`
      # then resolves scipy via pyimport_conda, which falls back to a plain
      # pyimport here (PyCall is not Conda-managed). python3-dev provides the
      # libpython that PyCall's build dlopens (without it the build errors with
      # "Couldn't find libpython"); python3-scipy puts scipy in that system
      # python so the import succeeds. (Same packages as the CI workflow.)
      - name: Install system Python dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-scipy

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Install dependencies
        run: julia --color=yes --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ env.CAN_DEPLOY_DOCS == 'true' && secrets.GITHUB_TOKEN || '' }}
          DOCUMENTER_KEY: ''
        run: julia --color=yes --project=docs/ docs/make.jl
